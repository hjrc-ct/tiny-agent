apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-client
  namespace: tiny-agent
spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-client

  template:
    metadata:
      labels:
        app: python-client

    spec:
      enableServiceLinks: false

      containers:
        - name: python-client

          image: asia-south2-docker.pkg.dev/c8-labs/tiny-agent/python-client:v1

          env:
            - name: MINIO_ENDPOINT
              value: "minio.tiny-agent.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "knowledge"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootUser

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: rootPassword
            - name: CHROMA_HOST
              value: "chroma.tiny-agent.svc.cluster.local"
            - name: CHROMA_PORT
              value: "8000"
            - name: OLLAMA_URL
              value: "http://ollama.tiny-agent.svc.cluster.local:11434"
            - name: EMBED_MODEL
              value: "qwen3-embedding:0.6b"
            - name: CHAT_MODEL
              value: "qwen3:1.7b"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: python-client
  namespace: tiny-agent
spec:
  selector:
    app: python-client
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP